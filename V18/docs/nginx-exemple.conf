# Exemple de reverse proxy nginx devant Cassandra.
# Cassandra écoute sur 127.0.0.1:9000 par défaut (BIND_HOST / PORT dans install.sh) ;
# nginx porte le domaine et le TLS. Remplace cassandra.example.org par ton domaine,
# obtiens un certificat (par exemple : certbot --nginx -d cassandra.example.org),
# puis : cp nginx-exemple.conf /etc/nginx/sites-available/cassandra.conf
#        ln -s /etc/nginx/sites-available/cassandra.conf /etc/nginx/sites-enabled/
#        nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name cassandra.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cassandra.example.org;

    ssl_certificate     /etc/letsencrypt/live/cassandra.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cassandra.example.org/privkey.pem;

    client_max_body_size 64m;

    location / {
        proxy_pass         http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Le chat et le salon utilisent des flux longs (SSE) et des WebSockets.
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_buffering    off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

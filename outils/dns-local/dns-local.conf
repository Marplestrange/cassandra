# Cassandra (10-10) — le DNS local de la maison (dnsmasq, sans DHCP : la box garde le DHCP).
# Il n'écoute que sur l'adresse locale d'Orion ; le pare-feu (socle) ne l'ouvre qu'au réseau local.
listen-address=192.168.1.199
# Son adresse IPv6 stable (dérivée de la carte réseau) : celle à donner à la box comme DNS IPv6.
listen-address=2a01:e0a:8a2:270:6600:6aff:fe75:db3f
bind-dynamic
port=53
no-resolv
no-hosts
server=192.168.1.254
addn-hosts=/var/lib/cassandra-dns-local/noms.hosts
# Relu au rechargement : les noms qui se répondent ici seuls (pas d'IPv6 de Cloudflare).
servers-file=/var/lib/cassandra-dns-local/locaux.servers
domain-needed
cache-size=2000
pid-file=/run/cassandra-dns-local.pid

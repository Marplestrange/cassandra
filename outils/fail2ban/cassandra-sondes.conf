# Cassandra (09-10) — ce qui ne s'appelle que pour forcer une porte : secrets (.env, wp-config), dépôts (.git),
# greffons piratés, failles connues. Même liste que _EFFRACTION_RE du Sensorium (hors xmlrpc et phpmyadmin).
[Definition]
failregex = ^<HOST> \S+ \S+ \[[^\]]+\] "(?:GET|POST|HEAD) \S*(?:\.env\b|/\.git/|wp-config\.php|/wp-content/plugins/[^/ ]+/(?:up|shell|x|fix)\.php|eval-stdin\.php|/vendor/phpunit|/cgi-bin/|\.\./|/boaform|/HNAP1)
ignoreregex =
datepattern = {^LN-BEG}%%d/%%b/%%Y:%%H:%%M:%%S

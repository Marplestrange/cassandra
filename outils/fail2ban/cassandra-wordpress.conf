# Cassandra (09-10) — mot de passe WordPress refusé : un POST sur wp-login.php rendu 200 (une connexion réussie
# rend 302), et toute tentative par xmlrpc.php (porte des attaques en masse).
[Definition]
failregex = ^<HOST> \S+ \S+ \[[^\]]+\] "POST /wp-login\.php[^"]*" 200
            ^<HOST> \S+ \S+ \[[^\]]+\] "POST /xmlrpc\.php[^"]*"
ignoreregex =
datepattern = {^LN-BEG}%%d/%%b/%%Y:%%H:%%M:%%S

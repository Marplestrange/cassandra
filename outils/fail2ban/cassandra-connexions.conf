# Cassandra (10-10) — une connexion refusée aux pages publiques : Cassandra (POST /api/login → 401),
# Vaultwarden (POST /identity/connect/token → 400 ; page d'administration POST /admin → 401).
# Lu dans le journal nginx de chaque site : l'adresse réelle du visiteur (Vaultwarden, derrière Docker, ne voit que
# celle du pont).
[Definition]
failregex = ^<HOST> \S+ \S+ \[[^\]]+\] "POST /api/login[^"]*" 401
            ^<HOST> \S+ \S+ \[[^\]]+\] "POST /identity/connect/token[^"]*" 400
            ^<HOST> \S+ \S+ \[[^\]]+\] "POST /admin[^"]*" 401
ignoreregex =
datepattern = {^LN-BEG}%%d/%%b/%%Y:%%H:%%M:%%S
